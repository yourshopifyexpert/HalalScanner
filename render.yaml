services:
  - type: web
    name: halalscanner-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///./halalscanner.db
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
