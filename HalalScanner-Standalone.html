<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 HalalScanner - Standalone Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .demo-badge {
            background: #f39c12;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result-card {
            margin-top: 20px;
            padding: 25px;
            border-radius: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card.halal {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
        }

        .result-card.haram {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .result-card.suspicious {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
        }

        .result-card.unknown {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            color: white;
        }

        .verdict-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }

        .verdict-label {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .confidence {
            font-size: 1.3em;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .ingredients-list {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .ingredient-item {
            padding: 12px;
            margin: 8px 0;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
        }

        .ingredient-icon {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .ingredient-details {
            flex: 1;
        }

        .ingredient-name {
            font-weight: bold;
            font-size: 1.1em;
        }

        .ingredient-reason {
            opacity: 0.9;
            margin-top: 3px;
        }

        .examples {
            margin-top: 20px;
        }

        .example-btn {
            background: #f8f9ff;
            border: 2px solid #667eea;
            color: #667eea;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .example-btn:hover {
            background: #667eea;
            color: white;
        }

        .hidden {
            display: none;
        }

        .suggestions {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .suggestions h4 {
            margin-bottom: 10px;
        }

        .suggestions ul {
            list-style-position: inside;
        }

        .suggestions li {
            padding: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌙 HalalScanner</h1>
            <p>AI-Powered Halal Product Verification</p>
            <div style="margin-top: 15px;">
                <span class="demo-badge">🔬 OFFLINE DEMO MODE</span>
            </div>
        </div>

        <div class="card">
            <h3 style="margin-bottom: 15px;">Enter Product Ingredients:</h3>
            <textarea id="ingredientsInput" placeholder="Example: Water, Sugar, Wheat Flour, Salt, Natural Flavors..."></textarea>

            <div class="examples">
                <p style="color: #666; margin-bottom: 10px;"><strong>Try these examples:</strong></p>
                <button class="example-btn" onclick="loadExample('halal')">✅ Halal Product</button>
                <button class="example-btn" onclick="loadExample('haram')">❌ Haram Product</button>
                <button class="example-btn" onclick="loadExample('suspicious')">⚠️ Suspicious Product</button>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <button class="btn" onclick="scanProduct()">
                    🔍 Scan Product
                </button>
            </div>
        </div>

        <div id="resultSection" class="hidden"></div>
    </div>

    <script>
        // Simulated classification rules (matches backend logic)
        const haramKeywords = ['pork', 'pig', 'bacon', 'ham', 'lard', 'alcohol', 'ethanol', 'wine', 'beer', 'blood'];
        const halalKeywords = ['water', 'sugar', 'salt', 'flour', 'wheat', 'rice', 'oil', 'vegetable'];
        const ambiguousKeywords = ['gelatin', 'enzymes', 'natural flavors', 'glycerin', 'mono and diglycerides'];

        function loadExample(type) {
            const examples = {
                'halal': 'Water, Sugar, Wheat Flour, Salt, Vegetable Oil, Yeast',
                'haram': 'Water, Sugar, Pork Gelatin, Salt, Bacon Bits',
                'suspicious': 'Water, Sugar, Gelatin, Natural Flavors, Enzymes'
            };
            document.getElementById('ingredientsInput').value = examples[type];
        }

        function scanProduct() {
            const ingredientsText = document.getElementById('ingredientsInput').value.trim();

            if (!ingredientsText) {
                alert('Please enter ingredients!');
                return;
            }

            // Parse ingredients
            const ingredients = ingredientsText
                .toLowerCase()
                .split(/[,;]/)
                .map(ing => ing.trim())
                .filter(ing => ing.length > 0);

            // Classify each ingredient
            const analysis = ingredients.map(ing => classifyIngredient(ing));

            // Determine overall verdict
            const hasHaram = analysis.some(a => a.status === 'HARAM');
            const hasAmbiguous = analysis.some(a => a.status === 'AMBIGUOUS');
            const hasUnknown = analysis.some(a => a.status === 'UNKNOWN');

            let verdict, confidence;
            if (hasHaram) {
                verdict = 'HARAM';
                confidence = 0.95;
            } else if (hasAmbiguous) {
                verdict = 'SUSPICIOUS';
                confidence = 0.70;
            } else if (hasUnknown) {
                verdict = 'UNKNOWN';
                confidence = 0.50;
            } else {
                verdict = 'HALAL';
                confidence = 0.90;
            }

            displayResult({
                verdict: verdict,
                confidence: confidence,
                explanation: analysis,
                ingredients: ingredients
            });
        }

        function classifyIngredient(ingredient) {
            const ing = ingredient.toLowerCase();

            // Check haram
            for (let keyword of haramKeywords) {
                if (ing.includes(keyword)) {
                    return {
                        ingredient: ingredient,
                        status: 'HARAM',
                        reason: `Contains ${keyword} (haram ingredient)`
                    };
                }
            }

            // Check ambiguous
            for (let keyword of ambiguousKeywords) {
                if (ing.includes(keyword)) {
                    return {
                        ingredient: ingredient,
                        status: 'AMBIGUOUS',
                        reason: 'May contain animal-derived components - verification needed'
                    };
                }
            }

            // Check halal
            for (let keyword of halalKeywords) {
                if (ing.includes(keyword)) {
                    return {
                        ingredient: ingredient,
                        status: 'HALAL',
                        reason: 'Known halal ingredient'
                    };
                }
            }

            // Unknown
            return {
                ingredient: ingredient,
                status: 'UNKNOWN',
                reason: 'Not in database - manual review needed'
            };
        }

        function displayResult(data) {
            const verdictIcons = {
                'HALAL': '✅',
                'HARAM': '❌',
                'SUSPICIOUS': '⚠️',
                'UNKNOWN': '❓'
            };

            const statusIcons = {
                'HALAL': '✅',
                'HARAM': '❌',
                'AMBIGUOUS': '⚠️',
                'UNKNOWN': '❓'
            };

            const ingredientsList = data.explanation.map(ing => `
                <div class="ingredient-item">
                    <div class="ingredient-icon">${statusIcons[ing.status]}</div>
                    <div class="ingredient-details">
                        <div class="ingredient-name">${ing.ingredient.toUpperCase()}</div>
                        <div class="ingredient-reason">${ing.reason}</div>
                    </div>
                </div>
            `).join('');

            const suggestions = data.verdict === 'SUSPICIOUS' ? `
                <div class="suggestions">
                    <h4>💡 Suggested Actions:</h4>
                    <ul>
                        <li>Contact manufacturer for ingredient source clarification</li>
                        <li>Look for halal certification on product</li>
                        <li>Consider alternative products with clear halal status</li>
                    </ul>
                </div>
            ` : '';

            const resultSection = document.getElementById('resultSection');
            resultSection.innerHTML = `
                <div class="result-card ${data.verdict.toLowerCase()}">
                    <div style="text-align: center;">
                        <div class="verdict-icon">${verdictIcons[data.verdict]}</div>
                        <div class="verdict-label">${data.verdict}</div>
                        <div class="confidence">Confidence: ${(data.confidence * 100).toFixed(0)}%</div>
                    </div>

                    <div class="ingredients-list">
                        <h3 style="margin-bottom: 15px;">📝 Ingredient Analysis (${data.ingredients.length} ingredients)</h3>
                        ${ingredientsList}
                    </div>

                    ${suggestions}
                </div>
            `;

            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        // Auto-load example on page load
        window.onload = function() {
            document.getElementById('ingredientsInput').value = 'Water, Sugar, Gelatin, Natural Flavors, Salt';
        };
    </script>
</body>
</html>
