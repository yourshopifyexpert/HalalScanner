<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 HalalScanner - Scan Products</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .upload-section {
            text-align: center;
            padding: 40px 20px;
            border: 3px dashed #667eea;
            border-radius: 15px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-section:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }

        .upload-section.dragover {
            background: #f0f4ff;
            border-color: #27ae60;
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .result-card {
            margin-top: 20px;
            padding: 25px;
            border-radius: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card.halal {
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
        }

        .result-card.haram {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
        }

        .result-card.suspicious {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
        }

        .result-card.unknown {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
            color: white;
        }

        .verdict-icon {
            font-size: 4em;
            margin-bottom: 10px;
        }

        .verdict-label {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .confidence {
            font-size: 1.3em;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .ingredients-list {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .ingredient-item {
            padding: 12px;
            margin: 8px 0;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
        }

        .ingredient-icon {
            font-size: 1.5em;
            margin-right: 10px;
        }

        .ingredient-details {
            flex: 1;
        }

        .ingredient-name {
            font-weight: bold;
            font-size: 1.1em;
        }

        .ingredient-reason {
            opacity: 0.9;
            margin-top: 3px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        input[type="file"] {
            display: none;
        }

        .suggestions {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
        }

        .suggestions h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .suggestions ul {
            list-style-position: inside;
            color: #555;
        }

        .suggestions li {
            padding: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌙 HalalScanner</h1>
            <p>AI-Powered Halal Product Verification</p>
        </div>

        <div class="card">
            <div class="upload-section" id="uploadSection">
                <div class="upload-icon">📷</div>
                <h3>Upload Product Image or Enter Ingredients</h3>
                <p style="color: #666; margin-top: 10px;">Click to select an image or drag and drop</p>
                <input type="file" id="fileInput" accept="image/*" capture="environment">
            </div>

            <div style="text-align: center; margin: 20px 0; color: #999;">OR</div>

            <div>
                <label style="display: block; margin-bottom: 10px; color: #333; font-weight: bold;">
                    Enter Ingredients Manually:
                </label>
                <textarea id="ingredientsInput" placeholder="Example: Water, Sugar, Wheat Flour, Salt, Natural Flavors..."></textarea>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <button class="btn" id="scanBtn" onclick="scanProduct()">
                    🔍 Scan Product
                </button>
            </div>
        </div>

        <div id="loadingSection" class="card loading hidden">
            <div class="spinner"></div>
            <h3>Analyzing ingredients...</h3>
            <p style="color: #666; margin-top: 10px;">Checking against halal database</p>
        </div>

        <div id="resultSection" class="hidden"></div>
    </div>

    <script>
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');
        const ingredientsInput = document.getElementById('ingredientsInput');
        const loadingSection = document.getElementById('loadingSection');
        const resultSection = document.getElementById('resultSection');
        const scanBtn = document.getElementById('scanBtn');

        // Click to upload
        uploadSection.addEventListener('click', () => {
            fileInput.click();
        });

        // Drag and drop
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileSelect();
            }
        });

        // File selection
        fileInput.addEventListener('change', handleFileSelect);

        let selectedImageBase64 = null;

        async function handleFileSelect() {
            const file = fileInput.files[0];
            if (file) {
                uploadSection.innerHTML = `
                    <div class="upload-icon">⏳</div>
                    <h3>Processing Image...</h3>
                    <p style="color: #667eea; margin-top: 10px;">Extracting text from ${file.name}</p>
                `;

                try {
                    // Convert image to base64
                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        selectedImageBase64 = e.target.result.split(',')[1]; // Remove data:image/xxx;base64, prefix

                        // Call backend OCR to extract text
                        const response = await fetch('/api/v1/scan/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                user_id: 'web_user_' + Date.now(),
                                image_base64: selectedImageBase64,
                                language_hint: 'en'
                            })
                        });

                        const data = await response.json();

                        // Update UI with extracted text
                        uploadSection.innerHTML = `
                            <div class="upload-icon">✅</div>
                            <h3>Text Extracted!</h3>
                            <p style="color: #27ae60; margin-top: 10px;">${file.name}</p>
                        `;

                        // Fill text box with extracted ingredients
                        ingredientsInput.value = data.ocr_text || "No text detected. Please enter ingredients manually.";

                        // Automatically display results
                        displayResult(data);
                        resultSection.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                } catch (error) {
                    uploadSection.innerHTML = `
                        <div class="upload-icon">❌</div>
                        <h3>OCR Failed</h3>
                        <p style="color: #e74c3c; margin-top: 10px;">Please enter ingredients manually</p>
                    `;
                    console.error('OCR Error:', error);
                }
            }
        }

        async function scanProduct() {
            const ingredients = ingredientsInput.value.trim();

            if (!ingredients) {
                alert('Please enter ingredients or upload an image!');
                return;
            }

            // Show loading
            loadingSection.classList.remove('hidden');
            resultSection.classList.add('hidden');
            scanBtn.disabled = true;

            try {
                const response = await fetch('/api/v1/scan/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: 'web_user_' + Date.now(),
                        ocr_text: ingredients,
                        language_hint: 'en'
                    })
                });

                const data = await response.json();
                displayResult(data);
            } catch (error) {
                alert('Error scanning product: ' + error.message);
            } finally {
                loadingSection.classList.add('hidden');
                scanBtn.disabled = false;
            }
        }

        function displayResult(data) {
            const verdictIcons = {
                'HALAL': '✅',
                'HARAM': '❌',
                'SUSPICIOUS': '⚠️',
                'UNKNOWN': '❓'
            };

            const statusIcons = {
                'HALAL': '✅',
                'HARAM': '❌',
                'AMBIGUOUS': '⚠️',
                'UNKNOWN': '❓'
            };

            const ingredientsList = data.explanation.map(ing => `
                <div class="ingredient-item">
                    <div class="ingredient-icon">${statusIcons[ing.status]}</div>
                    <div class="ingredient-details">
                        <div class="ingredient-name">${ing.ingredient}</div>
                        <div class="ingredient-reason">${ing.reason}</div>
                    </div>
                </div>
            `).join('');

            const suggestions = data.suggested_actions && data.suggested_actions.length > 0 ? `
                <div class="suggestions">
                    <h4>📋 Suggested Actions:</h4>
                    <ul>
                        ${data.suggested_actions.map(action => `<li>${action}</li>`).join('')}
                    </ul>
                </div>
            ` : '';

            resultSection.innerHTML = `
                <div class="result-card ${data.verdict.toLowerCase()}">
                    <div style="text-align: center;">
                        <div class="verdict-icon">${verdictIcons[data.verdict]}</div>
                        <div class="verdict-label">${data.verdict}</div>
                        <div class="confidence">Confidence: ${(data.confidence * 100).toFixed(0)}%</div>
                    </div>

                    <div class="ingredients-list">
                        <h3 style="margin-bottom: 15px;">📝 Ingredient Analysis (${data.normalized_ingredients.length} ingredients)</h3>
                        ${ingredientsList}
                    </div>

                    ${suggestions}
                </div>
            `;

            resultSection.classList.remove('hidden');
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
